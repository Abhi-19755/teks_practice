<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            display: flex;
            justify-content: space-between;
            background-color: rgb(68, 80, 149);
        }
        nav li{
            display: inline-block;
            padding: 15px 15px;
        }
         li a{
            color: white;
            font-size: 17px;
            text-decoration: none;
        }
        li:hover,  #contact:hover{
            cursor: pointer;
            background-color: rgb(136, 149, 227);  
            
        }
        #contact{
            background-color: transparent;
            color: white;
            font-size: 17px;
            border: none;
            margin-right: 40px;
            padding: 0 5px 0 5px;
        }
        .container{
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 1fr 60px;
            grid-template-areas:
            "aside main"
            "footer footer"
            ;
            height: 100vh;
        }      
        #box2{
            grid-area: aside;
            background-color: aquamarine;
            display: flex;
            
        }
        #box2 li {  
            width: 250px;
            padding: 10px 0 10px 50px;
            list-style-type: none;     
        }
        #box2 li a{
            display: block;
            color: black;      
        }
        #box2 li a:hover{
            color: white;
        }
        #box3{
            grid-area: main;
            background-color: bisque;
            display: flex;
            align-items: center;
        }
        #box3 h1{
            margin-left: 10%;
        }
        #box4{
            grid-area: footer;
            background-color: rgb(108, 108, 131);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #box4 p{
            
            font-size: 20px;
            color: white;
        }
        @media (max-width:500px){
            nav , nav li{
                display: none;
                flex-direction: column;                
            }
        } 
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">projects</a></li>
            </ul>
            <button id="contact">contact Us</button>
        </nav>
    </header>
    <div class="container">
        <div id="box2">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Projects</a></li>
            </ul>
        </div>
        <div id="box3">
            <h1>Hi, my name is Abhinav Miriyala</h1>
            
            
        </div>
        <div id="box4">
           <p> @copy rights - Lorem ipsum dolor sit amet consectetur adipisicing elit. Vel, placeat.  </p>
        </div>
    </div>
</body>
</html>
