<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fade In Example</title>
  <style>
    div {
      display: block;
      opacity: 0;
      width: 300px;
       transition: opacity 1s ease, transform 1s ease;
      transform: translateX(0px);
    }

    .fadeIn {
      opacity: 1;
       transform: translateX(10px);
    }
  </style>
</head>
<body>
  <button id="btn" onclick="Clicks()">Click Me!</button>
  <div id="content">
    <h1>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Magni hic aut officiis modi? 
      Consectetur eos ipsa illum omnis corrupti quas.
    </h1>
  </div>

  <script>
    function Clicks() {
      const content = document.getElementById("content");
      content.classList.add("fadeIn");  
    }
  </script>
</body>
</html>
