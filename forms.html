<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solo Leveling Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0a0a0a, #121212);
      color: #ffffff;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    form {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 30px;
      width: 350px;
      box-shadow: 0 0 20px rgba(0, 213, 255, 0.3);
      border: 1px solid #00d5ff30;
      animation: fadeIn 1s ease;
    }

    .imgcontainer {
      text-align: center;
      margin-bottom: 20px;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      box-shadow: 0 0 15px #00d5ff;
      border: 2px solid #00d5ff80;
    }

    .container {
      padding: 10px 0;
    }

    input[type=text], input[type=password] {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      background: #222;
      color: #00d5ff;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      transition: 0.3s;
      box-shadow: inset 0 0 5px #00d5ff40;
    }

    input[type=text]:focus, input[type=password]:focus {
      background: #111;
      box-shadow: 0 0 10px #00d5ff;
    }

    button[type=submit] {
      width: 100%;
      background: #00d5ff;
      color: #000;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button[type=submit]:hover {
      background: #00aacc;
      color: #fff;
    }

    .cancelbtn {
      width: 100%;
      padding: 10px;
      background-color: #444;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .cancelbtn:hover {
      background-color: #666;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 500;
      color: #ccc;
    }

    .psw {
      float: right;
      margin-top: 10px;
      font-size: 13px;
    }

    .psw a {
      color: #00d5ff;
      text-decoration: none;
    }

    .psw a:hover {
      text-decoration: underline;
    }

    input[type=checkbox] {
      accent-color: #00d5ff;
      margin-right: 5px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @media screen and (max-width: 400px) {
      form {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <form action="action_page.php" method="post">
    <div class="imgcontainer">
      <img src="/img/obito.jpg" alt="Avatar" class="avatar">
    </div>

    <div class="container">
      <label for="uname"><b>Username</b></label>
      <input type="text" placeholder="Enter Username" name="uname" required>

      <label for="psw"><b>Password</b></label>
      <input type="password" placeholder="Enter Password" name="psw" required>

      <button type="submit">Login</button>

      <label>
        <input type="checkbox" checked="checked" name="remember"> Remember me
      </label>
    </div>

    <div class="container" style="background-color: #1f1f1f; border-top: 1px solid #333;">
      <button type="button" class="cancelbtn">Cancel</button>
      <span class="psw">Forgot <a href="#">password?</a></span>
    </div>
  </form>

</body>
</html>
