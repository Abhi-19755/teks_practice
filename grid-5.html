<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 60px 1fr 50px;
            grid-template-areas: 
            "header header"
            "sidebar main"
            "footer footer"
            ;
            height: 100vh;
        }

        .header{
            grid-area: header;
            background-color: antiquewhite;
        }

        .sidebar{
            grid-area: sidebar;
            background-color: aqua;
        }

        .main{
            grid-area: main;
            background-color: aquamarine;
        }

        .footer{
            grid-area: footer;
            background-color: blueviolet;
        }

        @media (max-width:600px) {
            .container{

            grid-template-rows: 60px 1fr 1fr 50px;
                 grid-template-columns: 1fr 1fr;
            grid-template-areas:
            "header"
            "sidebar main"         
            "footer"    
            ;
            grid-template-columns: 1fr;
        }


        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">Header</div>
        <div class="sidebar">Side Bar hisdkjskjdasndn</div>
        <div class="main">Main content Lorem ipsum dolor sit amet consectetur, adipisicing elit. Laborum ad est vel voluptas consequatur! Voluptate, unde, sunt alias doloremque blanditiis deserunt aspernatur, voluptates officiis nemo sit ut quisquam eius dolore.</div>
        <div class="footer">footer</div>

    </div>
</body>
</html>
