<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main_box{
            display: flex;  
        }
        .box{
            width: 100px;
            height: 100px;
            border: 2px solid black; 
            margin-right: 15px;           
        }
        #box1{
            position: absolute;
            background-color: red;
            z-index: 1;
            margin-top: 20px;
            
        }
        
        #box2{
            position: relative;
            margin-left: 20px;
            background-color: blue;
        }
        
        #box3{
            background-color: green;
        }
        
        #box4{
            background-color: yellow;
        }


        .outer {
  position: relative;
  width: 300px;
  height: 200px;
  background-color: lightgray;
}

.inner {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 100px;
  height: 50px;
  background-color: red;
}

    </style>
</head>
<body>
    <div class="main_box">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
    </div>


    <div class="outer">
        <div class="inner"></div>
    </div>
    </body>
</html>
