<body>
    <!-- converting a block level element into an inline element which is inside a parent div  -->
<div style="display: inline-block;  gap: 10px;"> 
  <button>Yes</button>
  <button>No</button>
  <button>reset</button>
</div>


<div style="display: inline-flex; justify-content: center; width: 100px; background: orange;">
  Inline-flex 
</div>
<span style="display: inline-flex ; background: green;">
  Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequatur, enim.</span>

  <!-- inline -> we use it to convert a block element to an inline element we can't give width and height to it -->
   <!-- inline-block -> we used it to convert a block element to an inline element and also we can add height and width to that -->


  <div style="background-color: red; display: inline-block ; ">Lorem ipsum dolor sit amet consectetur adipisicing elit. Est velit illum exercitationem non,  , voluptatibus ullam quam suscipit fugit maxime, earum mollitia explicabo minus nulla!</div>
