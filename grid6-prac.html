<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 50px 1fr 40px;
            grid-template-areas:
                "header header"
                "aside main"
                "footer footer"
            ;
            height: 100vh;
        }

        #box1{
            grid-area: header;
            background-color: aliceblue;
        }

        #box2{
            grid-area: aside;
            background-color: aquamarine;
        }

        #box3{
            grid-area: main;
            background-color: greenyellow;
        }

        #box4{
            grid-area: footer;
            background-color: rgb(198, 124, 124);
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="box1">header</div>
        <div id="box2">aside</div>
        <div id="box3">main</div>
        <div id="box4">footer</div>
    </div>
</body>
</html>
