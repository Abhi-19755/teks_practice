<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .container {
        display: grid;
        grid-template-areas:
          "header header"
          "sidebar main" 
          
          /* sidebar will be first column and main will be second column */
          "footer footer";
        grid-template-columns: 250px 1fr;
        grid-template-rows: 60px 1fr 50px;
        height: 100vh;
      }

      .header {
        grid-area: header;
        background: #3f51b5;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .sidebar {
        grid-area: sidebar;
        background-color: #263238;
        color: white;
        padding: 20px;
      }

      .sidebar ul{
        list-style-type: none;
      }

      li{
        padding: 10px ;
      }

      .footer {
        grid-area: footer;
        background: #455a64;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .widget {
        background: white;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      @media (max-width:600px) {
        .container{
            grid-template-areas: 
            "header"
            "sidebar"
            "main"
            "footer"
            ;
            grid-template-columns: 1fr;
          }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Dashboard</div>
      <div class="sidebar">
        <h3>menu</h3>
        <ul>
          <li>Overview</li>
          <li>Reports</li>
          <li>Settings</li>
        </ul>
      </div>
      <div class="main">
        <div class="widget">widget 1</div>
        <div class="widget">widget 2</div>
        <div class="widget">widget 3</div>
        <div class="widget">widget 4</div>
      </div>
      <div class="footer">@ 2025 My Dashboard</div>
    </div>
  </body>
</html>
