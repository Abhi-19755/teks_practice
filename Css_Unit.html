<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Units</title>
    <style>
        #para1{
            font-size: 3em;
        }

        #span1{
            font-size: 0.5em;
        }

        #para2{
            font-size: 2rem;
        }

        #span2{
            font-size: 3rem;
        }
    </style>
</head>
<body>

    <!-- em -> it a relative measure where the size is depends upon the parent -->
    <p id="para1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Aspernatur maxime incidunt voluptate ob <span id="span1">hi my name is abhinav</span> </p>

    <!-- rem -> it doesnot depends upon the parent it multiplies its value with 16px -->
    <p id="para2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Temporibus, animi! <span id="span2">what are you doing </span></p>

    



</body>
</html>
